<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://caradosenac.github.io/acaiteria/" sizes="48x48" type="logo.png">
</head>
<body>
    <div class="topo">
        <a href="https://github.io" class="btn-sair">Sair</a>
    </div>

    <div class="login-box">
        <h2>Login</h2>
        <form action="acai.html" method="get">
            <input type="text" name="usuário" placeholder="Nome do usuário" required>  
            <input type="password" name="senha" placeholder="senha" required>
            <button type="submit">Entrar</button>
        </form>
    </div>

    <a href="index.html" class="imagem-topo">
        <img src="logo.png" alt="Logo">
    </a>
</body>
</html>
