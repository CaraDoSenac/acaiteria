<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endereço de Entrega</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container-entrega {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.685);
            position: relative;
            z-index: 10;
        }
        .container-entrega h2 {
            text-align: center;
            color: #32003f;
            margin-bottom: 20px;
            font-size: 24px;
            border-bottom: 2px solid #8e44ad;
            padding-bottom: 10px;
        }
        .campo-grupo {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .campo-grupo label {
            font-weight: bold;
            color: #5e2b84;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .campo-grupo input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        .campo-grupo input:focus {
            border-color: #8e44ad;
        }
        .linha-dupla {
            display: flex;
            gap: 10px;
        }
        .linha-dupla .campo-grupo {
            flex: 1;
        }
        .btn-avancar {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 12px;
            background: #5d007a;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
        }
        .btn-avancar:hover {
            background: #ac45ac;
        }
    </style>
</head>
<body>
    <div class="container-entrega">
        <h2>Local de Entrega</h2>
        <form id="form-entrega" onsubmit="salvarEAvancar(event)">
            <div class="campo-grupo">
                <label for="rua">Rua / Avenida *</label>
                <input type="text" id="rua" required placeholder="Ex: Av. Brasil">
            </div>

            <div class="linha-dupla">
                <div class="campo-grupo">
                    <label for="numero">Número *</label>
                    <input type="text" id="numero" required placeholder="123">
                </div>
                <div class="campo-grupo">
                    <label for="bairro">Bairro *</label>
                    <input type="text" id="bairro" required placeholder="Centro">
                </div>
            </div>

            <div class="campo-grupo">
                <label for="complemento">Complemento</label>
                <input type="text" id="complemento" placeholder="Apt 102, Bloco B (Opcional)">
            </div>

            <div class="campo-grupo">
                <label for="referencia">Ponto de Referência</label>
                <input type="text" id="referencia" placeholder="Próximo ao mercado (Opcional)">
            </div>

            <button type="submit" class="btn-avancar">Ir para Pagamento</button>
        </form>
    </div>

    <script>
        function salvarEAvancar(e) {
            e.preventDefault();
            let endereco = {
                rua: document.getElementById('rua').value,
                numero: document.getElementById('numero').value,
                bairro: document.getElementById('bairro').value,
                complemento: document.getElementById('complemento').value,
                referencia: document.getElementById('referencia').value
            };
            localStorage.setItem('enderecoEntrega', JSON.stringify(endereco));
            window.location.href = "bao.html";
        }
    </script>

    <a href="index.html" class="imagem-topo">
        <img src="logo.png" alt="Logo">
    </a>
</body>
</html>
